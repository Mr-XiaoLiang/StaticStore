<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="description" content="Mr-XiaoLiang 的应用小店：手机、手表与桌面端应用，含版本历史与安装说明。" />
    <meta name="author" content="Mr-XiaoLiang" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lollipop Store" />
    <meta property="og:description" content="Android、Wear OS 与桌面端应用的分发与版本记录。" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 主题预应用：与品牌站共用同一个存储键，切换主题后两个站点一致，且不闪白 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lollipop-theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {}
      })()
    </script>

    <title>Lollipop Store</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
